<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DC Inside Mobile Web Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f2f4f7;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        .dc-blue { color: #29367c; }
        .bg-dc-blue { background-color: #29367c; }
        .dc-border { border-color: #29367c; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen">

    <!-- Mobile Device Container -->
    <div class="w-full max-w-md bg-white shadow-md flex flex-col justify-between relative min-h-screen pb-16">
        
        <!-- Header Section -->
        <header class="sticky top-0 z-40 bg-white">
            <!-- Main Navy Header -->
            <div class="bg-dc-blue px-3 py-2 flex items-center justify-between text-white">
                <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
                    <!-- DC Logo Icon -->
                    <div class="font-black italic text-xl tracking-tighter bg-white text-[#29367c] px-1.5 py-0.5 rounded-sm flex items-center justify-center leading-none">
                        dc
                    </div>
                </div>
                <!-- Search Bar -->
                <div class="flex-1 mx-2 relative">
                    <input type="text" placeholder="갤러리 & 통합검색" class="w-full pl-8 pr-7 py-1 text-xs text-black rounded-sm focus:outline-none bg-white">
                    <i class="fa-solid fa-bars absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 text-xs cursor-pointer" onclick="showToast('메뉴를 열었습니다.')"></i>
                    <i class="fa-solid fa-magnifying-glass absolute right-2 top-1/2 -translate-y-1/2 text-[#29367c] text-xs cursor-pointer" onclick="showToast('검색 결과를 불러오는 중...')"></i>
                </div>
                <!-- Recent Visit Button -->
                <button onclick="showToast('최근 방문 갤러리가 없습니다.')" class="border border-white/50 text-[11px] px-2 py-0.5 rounded text-white whitespace-nowrap active:opacity-70">
                    최근방문
                </button>
            </div>

            <!-- Sub Category Navigation Bar -->
            <nav class="bg-[#3b4890] text-white text-[12px] flex justify-between items-center px-3 py-1.5 border-b border-blue-900 overflow-x-auto no-scrollbar font-medium">
                <span onclick="goHome()" class="text-yellow-300 font-bold cursor-pointer whitespace-nowrap">갤러리</span>
                <span onclick="showToast('마이너갤러리로 이동')" class="hover:text-gray-200 cursor-pointer whitespace-nowrap">마이너갤</span>
                <span onclick="showToast('미니갤러리로 이동')" class="hover:text-gray-200 cursor-pointer whitespace-nowrap">미니갤</span>
                <span onclick="showToast('인물갤러리로 이동')" class="hover:text-gray-200 cursor-pointer whitespace-nowrap">인물갤</span>
                <span onclick="showToast('갤로그로 이동')" class="hover:text-gray-200 cursor-pointer whitespace-nowrap">갤로그</span>
                <span onclick="showToast('이벤트 페이지')" class="hover:text-gray-200 cursor-pointer whitespace-nowrap">이벤트</span>
            </nav>

            <!-- Gallery Header Banner Info -->
            <div class="px-3 py-2 flex items-center justify-between border-b border-gray-200 bg-white">
                <div class="flex items-center space-x-1.5">
                    <h1 class="font-bold text-base text-gray-900 cursor-pointer" onclick="goHome()">제녹스</h1>
                    <span class="text-[10px] bg-gray-100 border border-gray-300 text-gray-600 rounded-full w-4 h-4 flex items-center justify-center font-bold">m</span>
                    <span class="text-xs text-gray-400 font-normal">(31,994)</span>
                </div>
                <div class="flex items-center space-x-2 text-xs text-gray-500">
                    <i class="fa-regular fa-circle-question text-gray-400 cursor-pointer" onclick="showToast('갤러리 정보 안내')"></i>
                    <span class="cursor-pointer" onclick="showToast('설정 페이지')">설정<span class="text-red-500 font-bold ml-0.5">N</span></span>
                    <span class="text-gray-300">|</span>
                    <span class="cursor-pointer" onclick="showToast('연관 갤러리 목록')">연관</span>
                    <button onclick="openWritePage()" class="ml-1 border border-[#29367c] text-[#29367c] font-bold px-2 py-0.5 rounded text-xs hover:bg-blue-50 active:scale-95 transition-all">
                        글쓰기
                    </button>
                </div>
            </div>

            <!-- Back Navigation Bar (Shows when not on main list) -->
            <div id="backNav" class="hidden bg-gray-100 px-3 py-1.5 border-b border-gray-200 flex items-center justify-between text-xs text-gray-700">
                <button onclick="goHome()" class="flex items-center space-x-1 font-bold text-[#29367c] hover:underline">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>뒤로가기 (목록으로)</span>
                </button>
                <span id="currentViewTitle" class="text-gray-500 text-[11px]">게시글 보기</span>
            </div>
        </header>

        <!-- Dynamic Main Content Area -->
        <main id="mainContent" class="flex-1 bg-white">
            <!-- Top Sponsored Banner AD -->
            <div class="bg-gray-50 p-2.5 border-b border-gray-200 text-xs">
                <div class="flex items-center space-x-1.5">
                    <span class="font-bold text-gray-800">리디북스 - 밴픽부터 불쾌했습니다(도토리타르트)</span>
                    <span class="text-[10px] border border-gray-300 text-gray-400 px-1 rounded">AD</span>
                </div>
                <p class="text-[11px] text-gray-400 mt-0.5 truncate">#게임물 #배틀연애 #짝사랑공 #연상공 #인성파탄수 #미인수</p>
            </div>

            <!-- Tab Navigation (전체 / 개념글 / 공지) -->
            <div class="flex border-b border-gray-200 text-center font-bold text-sm bg-white">
                <button id="tab-all" onclick="switchTab('all')" class="flex-1 py-2.5 text-gray-500 border-b-2 border-transparent">
                    전체
                </button>
                <button id="tab-concept" onclick="switchTab('concept')" class="flex-1 py-2.5 border-b-2 border-[#29367c] text-[#29367c]">
                    개념글
                </button>
                <button id="tab-notice" onclick="switchTab('notice')" class="flex-1 py-2.5 text-gray-500 border-b-2 border-transparent">
                    공지
                </button>
                <div onclick="showToast('정렬 옵션 설정')" class="w-16 flex items-center justify-center text-xs text-gray-500 border-l border-gray-100 cursor-pointer">
                    30개 <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
                </div>
            </div>

            <!-- Sub Category Filter Pills -->
            <div id="subFilterBar" class="hidden flex items-center space-x-1 px-2 py-1.5 overflow-x-auto no-scrollbar border-b border-gray-100 bg-gray-50/50 text-xs">
                <button onclick="filterCategory('all', this)" class="px-2.5 py-1 rounded-full bg-[#29367c] text-white whitespace-nowrap text-[11px] font-medium filter-btn">전체</button>
                <button onclick="filterCategory('일반', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">일반</button>
                <button onclick="filterCategory('자유', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">자유</button>
                <button onclick="filterCategory('사건/사고', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">사건/사고</button>
                <button onclick="filterCategory('스샷', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">스샷</button>
                <button onclick="filterCategory('그림', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">그림</button>
                <button onclick="filterCategory('정보', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">정보</button>
            </div>

            <!-- Fixed Banner Announcements -->
            <div id="fixedNoticeList" class="divide-y divide-gray-100 border-b border-gray-200 bg-white">
                <div class="px-3 py-2 flex items-center justify-between text-xs cursor-pointer hover:bg-gray-50" onclick="showToast('설문 조사 페이지로 이동합니다.')">
                    <div class="flex items-center space-x-1.5 font-bold text-orange-600 truncate">
                        <span class="border border-orange-500 text-orange-600 rounded-full text-[10px] px-1 py-0.2">설문</span>
                        <span class="truncate">밴픽불쾌 읽으실 분</span>
                    </div>
                </div>
                <div class="px-3 py-1.5 flex items-center text-xs text-gray-600 space-x-2 cursor-pointer hover:bg-gray-50" onclick="showToast('광고 페이지로 이동합니다.')">
                    <span class="border border-gray-300 text-gray-500 rounded text-[10px] px-1">AD</span>
                    <span class="truncate">스포일러가 다수 포함되어 있습니다</span>
                </div>
                <div class="px-3 py-1.5 flex items-center text-xs text-gray-600 space-x-2 cursor-pointer hover:bg-gray-50" onclick="showToast('사전예약 페이지로 이동합니다.')">
                    <span class="border border-gray-300 text-gray-500 rounded text-[10px] px-1">AD</span>
                    <span class="truncate">문제될 시 삭제됨</span>
                </div>
            </div>

            <!-- Main Post List Container -->
            <div id="postListContainer" class="divide-y divide-gray-100 bg-white">
                <!-- Dynamic Posts Rendered Here -->
            </div>

        </main>

        <!-- Floating Write Button (FAB) -->
        <button onclick="openWritePage()" class="fixed bottom-6 right-5 w-12 h-12 bg-[#3b4890] text-white rounded-full shadow-lg flex items-center justify-center text-lg z-30 hover:bg-blue-900 transition-all active:scale-95">
            <i class="fa-solid fa-pen"></i>
        </button>

        <!-- Toast Notification Box -->
        <div id="toastBox" class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2 rounded-full shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50">
            알림 메시지
        </div>

    </div>

        // Tab Switcher Logic
        function switchTab(tab) {
            currentTab = tab;
            
            const tabs = ['all', 'concept', 'notice'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "flex-1 py-2.5 border-b-2 border-[#29367c] text-[#29367c] font-bold";
                    } else {
                        btn.className = "flex-1 py-2.5 text-gray-500 border-b-2 border-transparent font-medium";
                    }
                }
            });

            const filterBar = document.getElementById('subFilterBar');
            if (filterBar) {
                if (tab === 'all') {
                    filterBar.classList.remove('hidden');
                } else {
                    filterBar.classList.add('hidden');
                }
            }

            renderPostList();
        }

        // Sub Category Filter
        function filterCategory(cat, btnElement) {
            currentSubCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn";
            });
            btnElement.className = "px-2.5 py-1 rounded-full bg-[#29367c] text-white whitespace-nowrap text-[11px] font-medium filter-btn";
            renderPostList();
        }

        // Render Main Post List
        function renderPostList() {
            const container = document.getElementById('postListContainer');
            if (!container) return;
            container.innerHTML = '';

            let filteredPosts = postsData;

            if (currentTab === 'concept') {
                filteredPosts = postsData.filter(p => p.isConcept);
            } else if (currentTab === 'notice') {
                filteredPosts = postsData.filter(p => p.isNotice);
            } else if (currentTab === 'all') {
                if (currentSubCategory !== 'all') {
                    filteredPosts = postsData.filter(p => p.category === currentSubCategory);
                }
            }

            if (filteredPosts.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs">게시글이 없습니다.</div>`;
                return;
            }

                const postEl = document.createElement('div');
                postEl.className = "px-3 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors";

                            <span>조회 ${post.views}</span>
                            <span>추천 <span id="detailUpvoteCount" class="text-red-500">${post.upvotes}</span></span>
                            <span>댓글 <span class="text-red-500" id="detailCommentHeaderCount">${commentsData[id].length}</span></span>
                        </div>
                    </div>
                </div>

                <div class="p-3 text-xs text-gray-800 leading-relaxed min-h-[140px] bg-white border-b border-gray-100">
                    <p class="mb-3">${formattedContent}</p>
                    <div class="my-4 p-3 bg-gray-50 border border-gray-200 rounded text-center text-gray-500">
                        <i class="fa-regular fa-image text-2xl block mb-1 text-gray-400"></i>
                    </div>
                </div>

                <div class="py-4 bg-white flex justify-center items-center space-x-3 border-b border-gray-200">
                    <button onclick="votePost(${post.id}, 'up')" class="flex flex-col items-center justify-center border border-red-300 bg-red-50 hover:bg-red-100 w-16 h-16 rounded-md active:scale-95 transition-all">
                        <i class="fa-regular fa-thumbs-up text-red-500 text-lg mb-0.5"></i>
                        <span class="text-xs font-bold text-red-600">개념</span>
                        <span id="btnUpvoteNum" class="text-[10px] text-red-500 font-bold">${post.upvotes}</span>
                    </button>
                    <button onclick="votePost(${post.id}, 'down')" class="flex flex-col items-center justify-center border border-gray-300 bg-gray-50 hover:bg-gray-100 w-16 h-16 rounded-md active:scale-95 transition-all">
                        <i class="fa-regular fa-thumbs-down text-gray-500 text-lg mb-0.5"></i>
                        <span class="text-xs font-bold text-gray-600">비추</span>
                        <span id="btnDownvoteNum" class="text-[10px] text-gray-500 font-bold">0</span>
                    </button>
                </div>

                <div class="flex justify-around bg-gray-50 py-2 border-b border-gray-200 text-xs text-gray-600">
                    <button onclick="showToast('즐겨찾기가 완료되었습니다')" class="flex items-center space-x-1 hover:text-yellow-600"><i class="fa-solid fa-star text-yellow-500"></i><span>즐겨찾기</span></button>
                    <button onclick="showToast('스크랩 되었습니다')" class="flex items-center space-x-1 hover:text-blue-600"><i class="fa-regular fa-bookmark"></i><span>스크랩</span></button>
                    <button onclick="showToast('주소가 복사되었습니다')" class="flex items-center space-x-1 hover:text-green-600"><i class="fa-regular fa-share-from-square"></i><span>공유</span></button>
                    <button onclick="showToast('신고 접수가 완료되었습니다')" class="flex items-center space-x-1 hover:text-red-600"><i class="fa-regular fa-lightbulb"></i><span>신고</span></button>
                </div>

                <div class="bg-white p-3">
                    <div class="flex items-center justify-between border-b border-gray-200 pb-2 mb-2">
                        <span class="font-bold text-xs text-gray-800">댓글 [<span class="text-red-500" id="commentTotalCount">${commentsData[id].length}</span>]</span>
                        <button onclick="renderComments(${id}); showToast('댓글 목록이 새로고침 되었습니다.');" class="text-[11px] text-gray-500 hover:text-black"><i class="fa-solid fa-rotate-right mr-1"></i>새로고침</button>
                    </div>

                    <div id="commentsContainer" class="divide-y divide-gray-100 mb-3"></div>

                    <div class="bg-gray-50 p-2.5 rounded border border-gray-200">
                        <div class="flex space-x-1 mb-1.5">
                            <input id="cmtAuthor" type="text" value="ㅇㅇ" class="w-1/2 p-1 text-xs border border-gray-300 rounded bg-white">
                            <input id="cmtPw" type="password" placeholder="비밀번호" value="1234" class="w-1/2 p-1 text-xs border border-gray-300 rounded bg-white">
                        </div>
                        <div class="flex space-x-1.5">
                            <textarea id="cmtInput" rows="2" placeholder="타인의 권리를 침해하거나 명예를 훼손하는 댓글은 제재를 받을 수 있습니다." class="flex-1 p-1.5 text-xs border border-gray-300 rounded resize-none focus:outline-none bg-white"></textarea>
                            <button onclick="addComment(${id})" class="w-14 bg-[#29367c] text-white font-bold text-xs rounded hover:bg-blue-900 active:scale-95 transition-all">
                                등록
                            </button>
                        </div>
                    </div>
                </div>
            `;

            renderComments(id);
        }

        // Render Comments
        function renderComments(postId) {
            const container = document.getElementById('commentsContainer');
            if (!container) return;
            container.innerHTML = '';

            const list = commentsData[postId] || [];
            list.forEach(cmt => {
                const item = document.createElement('div');
                item.className = `py-2 text-xs ${cmt.isReply ? 'pl-4 bg-gray-50/50' : ''}`;
                item.innerHTML = `
                    <div class="flex items-center justify-between font-bold text-gray-700">
                        <div class="flex items-center space-x-1">
                            ${cmt.isReply ? '<span class="text-blue-900 font-bold mr-1">ㄴ</span>' : ''}
                            <span>${cmt.author}</span>
                            ${cmt.isApp ? '<span class="bg-gray-200 text-gray-600 px-0.5 text-[9px] rounded font-normal">dc App</span>' : ''}
                        </div>
                        <span class="text-[10px] text-gray-400 font-normal">${cmt.date}</span>
                    </div>
                    <p class="text-gray-800 mt-0.5 leading-normal ${cmt.isReply ? 'pl-3' : ''}">${cmt.content}</p>
                `;
                container.appendChild(item);
            });
        }

        // Add Comment Function
        function addComment(postId) {
            const author = document.getElementById('cmtAuthor').value.trim() || 'ㅇㅇ';
            const content = document.getElementById('cmtInput').value.trim();

            if (!content) {
                showToast('댓글 내용을 입력해주세요.');
                return;
            }

            const now = new Date();
            const dateStr = `${(now.getMonth() + 1).toString().padStart(2, '0')}.${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const newCmt = {
                id: Date.now(),
                author: author,
                date: dateStr,
                content: content,
                isApp: true
            };

            commentsData[postId].push(newCmt);
            
            const post = postsData.find(p => p.id === postId);
            if (post) post.commentsCount++;

            document.getElementById('cmtInput').value = '';
            document.getElementById('commentTotalCount').innerText = commentsData[postId].length;
            
            renderComments(postId);
            showToast('댓글이 등록되었습니다.');
        }

        // Vote (Up/Down) Post Function
        function votePost(postId, type) {
            const post = postsData.find(p => p.id === postId);
            if (!post) return;

            if (type === 'up') {
                post.upvotes++;
                const detailCount = document.getElementById('detailUpvoteCount');
                if (detailCount) detailCount.innerText = post.upvotes;
                const btnCount = document.getElementById('btnUpvoteNum');
                if (btnCount) btnCount.innerText = post.upvotes;
                showToast('개념글로 추천했습니다!');
            } else {
                const downEl = document.getElementById('btnDownvoteNum');
                if (downEl) downEl.innerText = parseInt(downEl.innerText) + 1;
                showToast('비추천했습니다.');
            }
        }

        // Write Page View Switch
        function openWritePage() {
            document.getElementById('backNav').classList.remove('hidden');
            document.getElementById('currentViewTitle').innerText = "글쓰기";

            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="p-3 bg-white">
                    <div class="flex items-center space-x-2 pb-2 border-b border-gray-200 mb-2">
                        <input id="writeAuthor" type="text" value="ㅇㅇ" placeholder="닉네임" class="w-1/2 p-1.5 text-xs border border-gray-300 rounded">
                        <input id="writePw" type="password" value="1234" placeholder="비밀번호" class="w-1/2 p-1.5 text-xs border border-gray-300 rounded">
                    </div>
                    
                    <div class="mb-2">
                        <input id="writeTitle" type="text" placeholder="제목을 입력하세요." class="w-full p-2 text-xs border border-gray-300 rounded focus:outline-none focus:border-blue-800">
                    </div>

                    <div class="flex items-center space-x-3 text-gray-500 border border-gray-200 rounded p-1.5 bg-gray-50 mb-2 text-xs">
                        <button onclick="showToast('굵게 서식이 선택되었습니다')" class="font-bold">B</button>
                        <button onclick="showToast('기울임 서식이 선택되었습니다')" class="italic">I</button>
                        <button onclick="showToast('밑줄 서식이 선택되었습니다')" class="underline">U</button>
                        <button onclick="showToast('이미지 첨부 버튼')" class="hover:text-black"><i class="fa-regular fa-image"></i></button>
                        <button onclick="showToast('링크 첨부 버튼')" class="hover:text-black"><i class="fa-solid fa-link"></i></button>
                    </div>

                    <textarea id="writeBody" rows="10" placeholder="내용을 입력하세요. (음란물, 법령 위반 게시물 등은 삭제될 수 있습니다.)" class="w-full p-2 text-xs border border-gray-300 rounded resize-none focus:outline-none"></textarea>

                    <div class="flex justify-end space-x-2 mt-3">
                        <button onclick="goHome()" class="px-4 py-1.5 border border-gray-300 text-gray-600 rounded text-xs active:bg-gray-100">취소</button>
                        <button onclick="submitNewPost()" class="px-4 py-1.5 bg-[#29367c] text-white font-bold rounded text-xs hover:bg-blue-900 active:scale-95 transition-all">등록</button>
                    </div>
                </div>
            `;
        }

        // Submit New Post
        function submitNewPost() {
            const titleEl = document.getElementById('writeTitle');
            const bodyEl = document.getElementById('writeBody');
            const authorEl = document.getElementById('writeAuthor');

            if (!titleEl || !bodyEl) return;

            const title = titleEl.value.trim();
            const body = bodyEl.value.trim();
            const author = (authorEl && authorEl.value.trim()) ? authorEl.value.trim() : 'ㅇㅇ';

            if (!title || !body) {
                showToast('제목과 내용을 모두 입력해 주세요.');
                return;
            }

            const now = new Date();
            const timeStr = `${(now.getMonth() + 1).toString().padStart(2, '0')}.${now.getDate().toString().padStart(2, '0')}`;
            const newId = Date.now();

            const newPost = {
                id: newId,
                isNotice: false,
                isConcept: true,
                title: title,
                author: author,
                date: timeStr,
                views: 1,
                upvotes: 1,
                commentsCount: 0,
                category: "일반",
                content: body
            };

            postsData.unshift(newPost);
            commentsData[newId] = []; // Initialize empty comments list for new post

            showToast('게시물이 등록되었습니다.');
            goHome();
        }

        // Navigation: Go Back to Main List View
        function goHome() {
            currentPostId = null;
            const backNav = document.getElementById('backNav');
            if (backNav) backNav.classList.add('hidden');
            
            const main = document.getElementById('mainContent');
            if (!main) return;

            main.innerHTML = `
                <div class="bg-gray-50 p-2.5 border-b border-gray-200 text-xs">
                    <div class="flex items-center space-x-1.5">
                        <span class="font-bold text-gray-800">기장,술추가 없이 투명한상담</span>
                        <span class="text-[10px] border border-gray-300 text-gray-400 px-1 rounded">AD</span>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-0.5 truncate">컨피그헤어는 많은 고객을 빠르게 시술하는 공간이 아닙니다 한 분 한 분을 존중합니다</p>
                </div>

                <div class="flex border-b border-gray-200 text-center font-bold text-sm bg-white">
                    <button id="tab-all" onclick="switchTab('all')" class="flex-1 py-2.5 text-gray-500 border-b-2 border-transparent">전체</button>
                    <button id="tab-concept" onclick="switchTab('concept')" class="flex-1 py-2.5 text-gray-500 border-b-2 border-transparent">개념글</button>
                    <button id="tab-notice" onclick="switchTab('notice')" class="flex-1 py-2.5 text-gray-500 border-b-2 border-transparent">공지</button>
                    <div onclick="showToast('정렬 옵션 설정')" class="w-16 flex items-center justify-center text-xs text-gray-500 border-l border-gray-100 cursor-pointer">
                        30개 <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
                    </div>
                </div>

                <div id="subFilterBar" class="hidden flex items-center space-x-1 px-2 py-1.5 overflow-x-auto no-scrollbar border-b border-gray-100 bg-gray-50/50 text-xs">
                    <button onclick="filterCategory('all', this)" class="px-2.5 py-1 rounded-full bg-[#29367c] text-white whitespace-nowrap text-[11px] font-medium filter-btn">전체</button>
                    <button onclick="filterCategory('일반', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">일반</button>
                    <button onclick="filterCategory('소식', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">소식</button>
                    <button onclick="filterCategory('클립', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">클립</button>
                    <button onclick="filterCategory('스샷', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">스샷</button>
                    <button onclick="filterCategory('그림', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">그림</button>
                    <button onclick="filterCategory('정보', this)" class="px-2.5 py-1 rounded-full bg-white border border-gray-200 text-gray-600 whitespace-nowrap text-[11px] filter-btn">정보</button>
                </div>

                <div id="fixedNoticeList" class="divide-y divide-gray-100 border-b border-gray-200 bg-white">
                    <div class="px-3 py-2 flex items-center justify-between text-xs cursor-pointer hover:bg-gray-50" onclick="showToast('설문 조사 페이지로 이동합니다.')">
                        <div class="flex items-center space-x-1.5 font-bold text-orange-600 truncate">
                            <span class="border border-orange-500 text-orange-600 rounded-full text-[10px] px-1 py-0.2">설문</span>
                            <span class="truncate">여성이 연애 상대로 가장 꺼리는 남성의 취미는?</span>
                        </div>
                    </div>
                    <div class="px-3 py-1.5 flex items-center text-xs text-gray-600 space-x-2 cursor-pointer hover:bg-gray-50" onclick="showToast('광고 페이지로 이동합니다.')">
                        <span class="border border-gray-300 text-gray-500 rounded text-[10px] px-1">AD</span>
                        <span class="truncate">가전디지털, 악세서리 SALE</span>
                    </div>
                    <div class="px-3 py-1.5 flex items-center text-xs text-gray-600 space-x-2 cursor-pointer hover:bg-gray-50" onclick="showToast('사전예약 페이지로 이동합니다.')">
                        <span class="border border-gray-300 text-gray-500 rounded text-[10px] px-1">AD</span>
                        <span class="truncate">아이폰 듀오, 사전예약 신청만 해도 공짜~!</span>
                    </div>
                </div>

                <div id="postListContainer" class="divide-y divide-gray-100 bg-white"></div>
            `;

            switchTab(currentTab);
        }

        // Show Toast Function
        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
